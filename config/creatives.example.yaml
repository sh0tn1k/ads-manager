# Пример config/creatives.yaml — заготовки текстов (без LLM). Скопируйте и замените своими.
# angle — короткая метка угла креатива; text — до 160 символов. Если файла нет, используются тексты
# прошлых объявлений.
creatives:
  - angle: example_angle
    text: "Пример текста объявления — замените своим."
