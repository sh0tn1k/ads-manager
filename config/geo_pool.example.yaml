# Пример config/geo_pool.yaml — список GEO-кандидатов для сетки гео × тема (раздел 9 плана).
# Скопируйте в config/geo_pool.yaml и заполните своими значениями. Значения ниже — только пример формата,
# а не рекомендация. Если файла нет, агент просто не строит сетку и пишет об этом в ответе /propose.

# Группы стран: имя группы -> список двухбуквенных кодов (getTargetCountriesList).
groups:
  example_group_a: [GB, IE]
  example_group_b: [DE, AT]

# Необязательно: языки для таргета users (getTargetLanguagesList).
language_codes: [en]

# Необязательно: id тем (getTargetTopicsList); каждая тема — отдельный уровень сетки.
topic_ids: []

# Необязательно: базовый CPM (TON) для новых ячеек, пока нет истории. Пусто — не задан.
# base_cpm: 0.10
