[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-ads-manager"
version = "0.1.0"
description = "Telegram Ads API client plus a Telegram bot UI to manage ads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiogram>=3.31.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
ads-bot = "bot.main:main"

[tool.setuptools.packages.find]
include = ["ads_api*", "bot*", "agent*"]

[tool.setuptools.package-data]
agent = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
